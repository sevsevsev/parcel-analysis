# Barren Hill Rd / Harts Ln, Whitemarsh Township, Montgomery County PA. Seven parcels, one listing.
name: barren_hill
title: Barren Hill Road and Harts Lane, Whitemarsh Township, Montgomery County PA
crs: "EPSG:2272"
aoi_buffer_ft: 500

parcels:
  source: file
  path: data/raw/barren_hill/BarrenHillParcels.shp
  id_field: PARCEL
  acres_field: LAND_ACRES
  label_field: LOCATION1
  keep_fields: [PARCEL, LOCATION1, LAND_ACRES, LAND_SF, FRONTFT, LAND_USE, YEAR_BUILT, SFLA,
                TOTAL_ASSE, EST_CO_TAX, EST_MUNI_T, EST_SCH_TA, SALE_DATE, CONSIDERAT, DEED_BOOK,
                DEED_PAGE, LEGAL1, Muni_Name, UTIL1, UTIL2, RESTRICTIO, FARMLAND]
  assessment_field: TOTAL_ASSE
  tax_fields: [EST_CO_TAX, EST_MUNI_T, EST_SCH_TA]   # annual tax estimate = sum

overlays:
  - use: nwi_wetlands
  - use: fema_flood
  - use: nhd_flowlines
  - use: nhd_waterbodies
  - use: ssurgo_soils
  - use: montco_zoning
  - use: montco_sewer
  - use: montco_water
  - use: montco_buildings
  - use: montco_roads
  - use: nrhp_districts
  - use: pa_conservation_easements
  - use: montco_preserved_farmland
  - use: montco_transmission
  - use: penndot_traffic
  - use: montco_school_districts
  - use: dep_streams_ch93

rasters:
  - use: dem_3dep

evaluation:
  max_build_slope_pct: 15
  property_line_setback_ft: 50
  stream_buffer_ft: 100
  wetland_buffer_ft: 50
  exclude_flood_zones: [A, AE, AO, AH, VE]
  drainage_way_threshold_acres: 5    # unmapped channels: cells draining at least this many acres
  drainage_way_buffer_ft: 50         # kept clear of building, like a stream buffer
  min_building_pad_acres: 0.5

growing:                         # where food could be grown; no setback applied
  garden_max_slope_pct: 8        # vegetable beds
  garden_min_jun_sun_h: 8
  orchard_max_slope_pct: 20      # fruit trees, terraced beds
  orchard_min_jun_sun_h: 7
  pasture_max_slope_pct: 25      # meadow, grazing, hay
  pasture_min_jun_sun_h: 6

qa:
  overlap_tolerance_sqft: 10
  gap_tolerance_sqft: 10
maps:
  basemap: true
  basemap_source: Esri.WorldImagery
  buffer_pct: 0.10
  dpi: 200
